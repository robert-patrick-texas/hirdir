# hirdir: the service that snippets/hirdir.conf proxies to.
#
# Installed as /etc/nginx/conf.d/hirdir.conf, which Ubuntu's nginx.conf loads inside
# its http { } block. On its own it changes nothing. Keep the address in step with
# "listen" under [server] in /etc/hirdir/config.toml.

upstream hirdir {
    server 127.0.0.1:8715;
}
