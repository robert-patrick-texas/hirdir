# hirdir under a URL prefix on an existing site, such as https://www.example.net/hirdir/
#
# The package keeps this text in /usr/share/hirdir/nginx/snippet.conf and writes it to
# /etc/nginx/snippets/hirdir.conf, when it is installed and again at each upgrade, with
# the prefix that file already has. It takes effect once the server { } block of a site
# that terminates TLS holds this line, which "sudo hirdir-setup" adds:
#
#     include snippets/hirdir.conf;
#
# The prefix is written on the three lines marked "prefix" below and nowhere else.
# "sudo hirdir-setup --prefix /inventory" rewrites the three together. Change nothing
# else here: a snippet that differs from the packaged one in more than its prefix is
# left as it is at an upgrade, and then misses what the new version needs. The service
# itself is named in /etc/nginx/conf.d/hirdir.conf.

# ^~ keeps the site's regular-expression locations from claiming hirdir's paths.
location ^~ /hirdir/ {                              # prefix
    proxy_pass http://hirdir/;                      # the trailing slash strips the prefix
    proxy_set_header X-Forwarded-Prefix /hirdir;    # prefix
    # hirdir trusts these headers from the loopback address only. $remote_addr replaces
    # anything the client sent, so a client cannot choose the address it is logged under.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    # An import sends its file as the body of the request, and hirdir takes a file of up
    # to 20 MB. Left to itself nginx refuses a body over 1 MB. A body over 20 MB is
    # refused here, with the 413 page of nginx, and never reaches hirdir.
    client_max_body_size 20m;
}

# The address without its last slash. The redirect is relative, so it stays right
# behind a load balancer or on a port that is not 443.
location = /hirdir { absolute_redirect off; return 301 /hirdir/; }    # prefix
